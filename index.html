<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Code Cleaner · 智能净化</title>
  <!-- Font Awesome 6 (免费图标库) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ============================================================
       全局 CSS 变量 (浅色 / 深色)
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* 浅色主题 (默认) */
      --bg-body: #f0f6fe;
      --bg-card: #ffffff;
      --bg-input: #f7faff;
      --bg-hover: #e6f0ff;
      --bg-active: #d4e4ff;
      --border-light: #d6e3f0;
      --border-focus: #3b8cff;
      --text-primary: #16213e;
      --text-secondary: #2f405c;
      --text-muted: #7e93aa;
      --shadow-color: rgba(59, 140, 255, 0.10);
      --blue-main: #3b8cff;
      --blue-light: #ecf4ff;
      --blue-dark: #2a6fd4;
      --green: #2ecc71;
      --red: #e74c5e;
      --radius: 14px;
      --radius-sm: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --transition: 0.25s ease;
      --shadow: 0 8px 30px var(--shadow-color);
    }

    /* 深色主题 */
    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #253449;
      --bg-hover: #2d3f5a;
      --bg-active: #3a5070;
      --border-light: #334560;
      --border-focus: #4a9eff;
      --text-primary: #e8edf5;
      --text-secondary: #b0c4dd;
      --text-muted: #7a8fa8;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --blue-main: #4a9eff;
      --blue-light: #1e334d;
      --blue-dark: #3b8cff;
      --shadow: 0 8px 30px var(--shadow-color);
    }

    /* ============================================================
       基础样式
       ============================================================ */
    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }

    /* ===== 主容器 ===== */
    .app-container {
      max-width: 1024px;
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
      transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    /* ===== 头部 ===== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      margin-bottom: 24px;
    }

    .app-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header .logo i {
      font-size: 28px;
      color: var(--blue-main);
      background: var(--blue-light);
      padding: 10px;
      border-radius: 12px;
      transition: background var(--transition), color var(--transition);
    }

    .app-header .logo h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      transition: color var(--transition);
    }

    .app-header .logo h1 span {
      color: var(--blue-main);
      font-weight: 300;
    }

    .app-header .sub {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 2px;
      transition: color var(--transition);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-badge {
      background: var(--blue-light);
      color: var(--blue-main);
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(59, 140, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
      white-space: nowrap;
    }

    .header-badge i {
      font-size: 13px;
    }

    /* ===== 主题切换按钮 ===== */
    .theme-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      font-family: var(--font);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    .theme-toggle i {
      font-size: 16px;
    }

    /* ===== 上传区 ===== */
    .drop-zone {
      border: 2px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      background: var(--bg-input);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      position: relative;
      margin-bottom: 22px;
      touch-action: manipulation;
    }

    .drop-zone:active {
      transform: scale(0.99);
    }

    .drop-zone.dragover {
      border-color: var(--blue-main);
      background: var(--blue-light);
    }

    .drop-zone .icon-big {
      font-size: 36px;
      color: var(--blue-main);
      display: block;
      margin-bottom: 4px;
      transition: color var(--transition);
    }

    .drop-zone .title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      transition: color var(--transition);
    }

    .drop-zone .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      transition: color var(--transition);
    }

    .drop-zone .hint .tag {
      background: var(--bg-card);
      padding: 2px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      margin: 0 2px;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* ===== 工具栏 ===== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      padding: 10px 0 14px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 16px;
      transition: border-color var(--transition);
    }

    .toolbar .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 450;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: color var(--transition);
      touch-action: manipulation;
    }

    .toggle-item:active {
      opacity: 0.7;
    }

    .toggle-item i {
      font-size: 14px;
      color: var(--blue-main);
      width: 18px;
      text-align: center;
    }

    /* 自定义开关 (移动友好) */
    .toggle-item input[type="checkbox"] {
      appearance: none;
      width: 38px;
      height: 22px;
      background: #ccd8e8;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.25s;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    [data-theme="dark"] .toggle-item input[type="checkbox"] {
      background: #3a4a62;
    }

    .toggle-item input[type="checkbox"]:checked {
      background: var(--blue-main);
    }

    .toggle-item input[type="checkbox"]::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .toggle-item input[type="checkbox"]:checked::before {
      transform: translateX(16px);
    }

    .toolbar-actions {
      display: flex;
      gap: 6px;
    }

    /* ===== 按钮系统 (移动端无 hover, 使用 active) ===== */
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font);
      touch-action: manipulation;
      white-space: nowrap;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.94);
    }

    /* 无 hover，用 active 替代 */
    .btn-primary {
      background: var(--blue-main);
      color: #fff;
      border-color: var(--blue-main);
    }

    .btn-primary:active {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      color: var(--red);
      border-color: var(--border-light);
      background: transparent;
    }

    .btn-danger:active {
      background: #fde8ea;
      border-color: var(--red);
    }

    [data-theme="dark"] .btn-danger:active {
      background: #3a1f24;
    }

    .btn-success {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .btn-success:active {
      background: #27ae60;
      border-color: #27ae60;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-light);
    }

    .btn-outline:active {
      background: var(--bg-hover);
      border-color: var(--blue-main);
    }

    /* ===== 文件列表 ===== */
    .file-list-container {
      min-height: 70px;
    }

    .file-list-header {
      display: grid;
      grid-template-columns: 2fr 1fr 100px;
      padding: 4px 8px 8px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 4px;
      transition: color var(--transition), border-color var(--transition);
    }

    .file-list-header .col-name { padding-left: 4px; }
    .file-list-header .col-status { text-align: center; }
    .file-list-header .col-actions { text-align: right; }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-item {
      display: grid;
      grid-template-columns: 2fr 1fr 100px;
      align-items: center;
      padding: 10px 8px;
      border-radius: var(--radius-sm);
      background: transparent;
      transition: background var(--transition);
      touch-action: manipulation;
    }

    .file-item:active {
      background: var(--bg-hover);
    }

    .file-item .info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .file-item .info .icon {
      font-size: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
      width: 22px;
      text-align: center;
      transition: color var(--transition);
    }

    .file-item .info .name {
      font-size: 13px;
      font-weight: 450;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
      transition: color var(--transition);
    }

    .file-item .info .size {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: auto;
      transition: color var(--transition);
    }

    .file-item .status-badge {
      justify-self: center;
      font-size: 11px;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 500;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      white-space: nowrap;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .file-item .status-badge.done {
      background: #e2f5ea;
      color: var(--green);
      border-color: rgba(46, 204, 113, 0.15);
    }

    [data-theme="dark"] .file-item .status-badge.done {
      background: #1a3a2a;
    }

    .file-item .status-badge.error {
      background: #fde8ea;
      color: var(--red);
      border-color: rgba(231, 76, 94, 0.12);
    }

    [data-theme="dark"] .file-item .status-badge.error {
      background: #3a1f24;
    }

    .file-item .actions {
      justify-self: end;
      display: flex;
      gap: 3px;
    }

    .file-item .actions .btn {
      padding: 3px 8px;
      font-size: 12px;
      background: transparent;
      border-color: transparent;
    }

    .file-item .actions .btn:active {
      background: var(--bg-hover);
      border-color: var(--border-light);
    }

    .file-item .actions .btn-download {
      color: var(--blue-main);
    }
    .file-item .actions .btn-download:active {
      background: var(--blue-light);
      border-color: var(--blue-main);
    }

    .file-item .actions .btn-delete {
      color: var(--text-muted);
    }
    .file-item .actions .btn-delete:active {
      color: var(--red);
      background: #fde8ea;
      border-color: var(--red);
    }

    [data-theme="dark"] .file-item .actions .btn-delete:active {
      background: #3a1f24;
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 30px 16px 22px;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    .empty-state .big-icon {
      font-size: 36px;
      color: var(--border-light);
      margin-bottom: 4px;
      transition: color var(--transition);
    }
    .empty-state .main-text {
      font-size: 14px;
      color: var(--text-secondary);
      transition: color var(--transition);
    }
    .empty-state .sub-text {
      font-size: 12px;
      margin-top: 2px;
    }

    /* ===== 底部 ===== */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
      transition: border-color var(--transition);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-left .stats-text {
      font-size: 13px;
      color: var(--text-secondary);
      transition: color var(--transition);
    }
    .footer-left .stats-text strong {
      color: var(--text-primary);
      font-weight: 600;
      transition: color var(--transition);
    }

    .footer-right {
      display: flex;
      gap: 8px;
    }

    /* ===== 预览模态框 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      animation: modalIn 0.25s ease;
      transition: background var(--transition), border-color var(--transition);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg-input);
      transition: background var(--transition), border-color var(--transition);
    }

    .modal-header .title {
      font-weight: 500;
      font-size: 14px;
      color: var(--text-primary);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color var(--transition);
    }

    .modal-header .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 4px;
      transition: color var(--transition);
      line-height: 1;
      touch-action: manipulation;
    }

    .modal-header .close-btn:active {
      color: var(--text-primary);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      background: var(--bg-card);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-all;
      transition: background var(--transition), color var(--transition);
    }

    .modal-body code {
      display: block;
      white-space: pre-wrap;
    }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--blue-main); }

    /* ============================================================
       响应式 (移动端优先)
       ============================================================ */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .app-container { padding: 18px 14px 16px; border-radius: 12px; }

      .app-header .logo i { font-size: 22px; padding: 8px; }
      .app-header .logo h1 { font-size: 19px; }
      .app-header .sub { font-size: 12px; }

      .header-badge { font-size: 12px; padding: 4px 12px; }
      .theme-toggle { font-size: 14px; padding: 4px 10px; }

      .drop-zone { padding: 24px 12px; }
      .drop-zone .icon-big { font-size: 30px; }
      .drop-zone .title { font-size: 14px; }
      .drop-zone .hint { font-size: 11px; }

      .toolbar .options { gap: 8px 14px; }
      .toggle-item { font-size: 12px; gap: 4px; }
      .toggle-item input[type="checkbox"] { width: 34px; height: 20px; }
      .toggle-item input[type="checkbox"]::before { width: 16px; height: 16px; }
      .toggle-item input[type="checkbox"]:checked::before { transform: translateX(14px); }

      .file-list-header { grid-template-columns: 2fr 1fr 70px; font-size: 10px; }
      .file-item { grid-template-columns: 2fr 1fr 70px; padding: 8px 4px; }
      .file-item .info .name { font-size: 12px; }
      .file-item .info .size { font-size: 10px; }
      .file-item .status-badge { font-size: 10px; padding: 2px 8px; }
      .file-item .actions .btn { padding: 2px 6px; font-size: 11px; }

      .footer-bar { flex-direction: column; align-items: stretch; gap: 8px; }
      .footer-right { justify-content: stretch; }
      .footer-right .btn { flex: 1; justify-content: center; }
      .footer-left .stats-text { font-size: 12px; }

      .modal-box { max-height: 92vh; }
      .modal-header { padding: 12px 16px; }
      .modal-header .title { font-size: 13px; }
      .modal-body { padding: 14px 16px; font-size: 12px; }
    }

    @media (max-width: 420px) {
      .app-container { padding: 12px 10px; }
      .app-header .logo h1 { font-size: 17px; }
      .header-badge { font-size: 11px; padding: 3px 10px; }
      .theme-toggle { font-size: 13px; padding: 3px 8px; }
      .theme-toggle i { font-size: 13px; }

      .toolbar .options { gap: 6px 10px; }
      .toggle-item { font-size: 11px; }
      .toggle-item input[type="checkbox"] { width: 30px; height: 18px; }
      .toggle-item input[type="checkbox"]::before { width: 14px; height: 14px; }
      .toggle-item input[type="checkbox"]:checked::before { transform: translateX(12px); }

      .file-item .info .name { font-size: 11px; }
      .file-item .status-badge { font-size: 9px; padding: 1px 6px; }
      .btn { font-size: 12px; padding: 4px 12px; }
    }

    /* ===== 安全区域适配 (iPhone) ===== */
    @supports (padding: max(0px)) {
      .app-container {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>

<div class="app-container" id="app">
  <!-- 头部 -->
  <header class="app-header">
    <div>
      <div class="logo">
        <i class="fas fa-code"></i>
        <h1>Code<span>Cleaner</span></h1>
      </div>
      <div class="sub"><i class="fas fa-bolt" style="color:var(--blue-main);margin-right:4px;"></i> 注释清除 · 空行压缩 · 代码净化</div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
      <div class="header-badge">
        <i class="fas fa-file-code"></i> <span id="fileCountBadge">0 个文件</span>
      </div>
    </div>
  </header>

  <!-- 上传区 -->
  <div class="drop-zone" id="dropZone">
    <i class="fas fa-cloud-upload-alt icon-big"></i>
    <div class="title">拖拽文件到此处，或点击上传</div>
    <div class="hint">
      支持 <span class="tag">.js</span> <span class="tag">.css</span> <span class="tag">.html</span> <span class="tag">.json</span> <span class="tag">.txt</span> 等
    </div>
    <input type="file" id="fileInput" multiple accept=".js,.css,.html,.htm,.json,.txt,.xml,.svg,.ts,.jsx,.tsx,.vue,.scss,.less,.md,.yaml,.yml,.toml,.ini,.conf">
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="options">
      <label class="toggle-item">
        <input type="checkbox" id="optRemoveComments" checked>
        <i class="fas fa-comment-slash"></i> 移除注释
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="optCompressBlankLines" checked>
        <i class="fas fa-compress-alt"></i> 压缩空行
      </label>
      <label class="toggle-item">
        <input type="checkbox" id="optStripTrailingSpaces" checked>
        <i class="fas fa-eraser"></i> 修剪行尾空格
      </label>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-danger" id="clearAllBtn"><i class="fas fa-trash-alt"></i> 清空</button>
    </div>
  </div>

  <!-- 文件列表 -->
  <div class="file-list-container">
    <div class="file-list-header">
      <span class="col-name"><i class="fas fa-file-alt" style="margin-right:4px;"></i>文件名</span>
      <span class="col-status">状态</span>
      <span class="col-actions">操作</span>
    </div>
    <div class="file-list" id="fileList">
      <div class="empty-state">
        <div class="big-icon"><i class="fas fa-inbox"></i></div>
        <div class="main-text">暂无文件</div>
        <div class="sub-text">上传代码文件开始清理</div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer-bar">
    <div class="footer-left">
      <span class="stats-text"><i class="fas fa-list-ul" style="color:var(--blue-main);margin-right:6px;"></i>共 <strong id="totalFiles">0</strong> 个文件，<strong id="readyFiles">0</strong> 个已就绪</span>
    </div>
    <div class="footer-right">
      <button class="btn btn-primary" id="downloadAllBtn" disabled>
        <i class="fas fa-download"></i> 下载全部 (ZIP)
      </button>
    </div>
  </div>
</div>

<!-- 预览模态框 -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="title"><i class="fas fa-eye" style="color:var(--blue-main);"></i> <span id="previewTitle">预览</span></span>
      <button class="close-btn" id="previewCloseBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="previewBody"><code></code></div>
  </div>
</div>

<!-- JSZip 用于打包 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
  (function() {
    'use strict';

    // ============================================================
    // 1. 深色模式管理 (保存到 localStorage)
    // ============================================================
    const STORAGE_KEY = 'codecleaner_theme';
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function getPreferredTheme() {
      return localStorage.getItem(STORAGE_KEY) || 'light';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      localStorage.setItem(STORAGE_KEY, theme);
      themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    // 初始化主题
    setTheme(getPreferredTheme());

    themeToggle.addEventListener('click', toggleTheme);

    // ============================================================
    // 2. 核心清理引擎
    // ============================================================
    function cleanCode(content, options) {
      let result = content;
      if (options.removeComments) {
        result = result.replace(/\/\*[\s\S]*?\*\//g, '');
        result = result.replace(/<!--[\s\S]*?-->/g, '');
        result = result.replace(/\/\/.*$/gm, '');
      }
      if (options.stripTrailingSpaces) {
        result = result.replace(/[ \t]+$/gm, '');
      }
      if (options.compressBlankLines) {
        result = result.replace(/\n\s*\n/g, '\n\n');
        result = result.replace(/^\n+/, '');
        result = result.replace(/\n+$/, '');
        result = result.replace(/\n\s*\n/g, '\n\n');
      }
      return result;
    }

    function getExtension(filename) {
      const i = filename.lastIndexOf('.');
      return i > 0 ? filename.slice(i + 1).toLowerCase() : '';
    }

    function isTextFile(ext) {
      const list = ['js', 'css', 'html', 'htm', 'json', 'txt', 'xml', 'svg', 'ts', 'jsx', 'tsx', 'vue', 'scss', 'less', 'md', 'yaml', 'yml', 'toml', 'ini', 'conf'];
      return list.includes(ext);
    }

    function getCleanedFilename(original) {
      const lastDot = original.lastIndexOf('.');
      if (lastDot === -1) return original + '_cleaned';
      return original.slice(0, lastDot) + '_cleaned' + original.slice(lastDot);
    }

    // ============================================================
    // 3. 状态与 DOM 引用
    // ============================================================
    let files = [];
    let idCounter = 0;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileListEl = document.getElementById('fileList');
    const totalFilesSpan = document.getElementById('totalFiles');
    const readyFilesSpan = document.getElementById('readyFiles');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    const optRemoveComments = document.getElementById('optRemoveComments');
    const optCompressBlankLines = document.getElementById('optCompressBlankLines');
    const optStripTrailingSpaces = document.getElementById('optStripTrailingSpaces');

    const previewModal = document.getElementById('previewModal');
    const previewBody = document.getElementById('previewBody');
    const previewTitle = document.getElementById('previewTitle');
    const previewCloseBtn = document.getElementById('previewCloseBtn');

    // ============================================================
    // 4. 渲染 (无 hover, 全部用 touch 友好)
    // ============================================================
    function render() {
      const ready = files.filter(f => f.cleanedContent !== undefined).length;
      const total = files.length;

      totalFilesSpan.textContent = total;
      readyFilesSpan.textContent = ready;
      fileCountBadge.textContent = `${total} 个文件`;
      downloadAllBtn.disabled = total === 0 || ready === 0;

      if (total === 0) {
        fileListEl.innerHTML = `
          <div class="empty-state">
            <div class="big-icon"><i class="fas fa-inbox"></i></div>
            <div class="main-text">暂无文件</div>
            <div class="sub-text">上传代码文件开始清理</div>
          </div>
        `;
        return;
      }

      let html = '';
      files.forEach((f, idx) => {
        const sizeKB = (f.size / 1024).toFixed(1);
        const isReady = f.cleanedContent !== undefined;
        let statusClass = 'status-badge';
        let statusText = '⏳ 待处理';
        if (f.status === 'error') {
          statusClass += ' error';
          statusText = '❌ 错误';
        } else if (isReady) {
          statusClass += ' done';
          statusText = '✅ 已清理';
        }

        const extIcon = {
          'js': 'fab fa-js',
          'css': 'fab fa-css3-alt',
          'html': 'fab fa-html5',
          'json': 'fas fa-brackets-curly',
          'txt': 'fas fa-file-alt',
          'default': 'fas fa-file-code'
        };
        const icon = extIcon[f.ext] || extIcon.default;

        html += `
          <div class="file-item" data-index="${idx}">
            <div class="info">
              <span class="icon"><i class="${icon}"></i></span>
              <span class="name" title="${f.name}">${escapeHtml(f.name)}</span>
              <span class="size">${sizeKB} KB</span>
            </div>
            <span class="${statusClass}">${statusText}</span>
            <div class="actions">
              ${isReady ? `<button class="btn btn-download download-btn" data-index="${idx}"><i class="fas fa-download"></i></button>` : ''}
              <button class="btn preview-btn" data-index="${idx}" ${!isReady ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}><i class="fas fa-eye"></i></button>
              <button class="btn btn-delete delete-btn" data-index="${idx}"><i class="fas fa-times"></i></button>
            </div>
          </div>
        `;
      });
      fileListEl.innerHTML = html;

      // 事件绑定 (使用 click 即可, 移动端友好)
      fileListEl.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          removeFile(idx);
        });
      });

      fileListEl.querySelectorAll('.preview-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          previewFile(idx);
        });
      });

      fileListEl.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          downloadSingle(idx);
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================================
    // 5. 文件操作
    // ============================================================
    function processFileEntry(entry) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const content = e.target.result;
          const ext = getExtension(entry.name);
          if (!isTextFile(ext)) {
            entry.status = 'error';
            resolve(entry);
            return;
          }
          const options = {
            removeComments: optRemoveComments.checked,
            compressBlankLines: optCompressBlankLines.checked,
            stripTrailingSpaces: optStripTrailingSpaces.checked,
          };
          try {
            const cleaned = cleanCode(content, options);
            entry.originalContent = content;
            entry.cleanedContent = cleaned;
            entry.status = 'done';
          } catch (err) {
            entry.status = 'error';
          }
          resolve(entry);
        };
        reader.onerror = function() {
          entry.status = 'error';
          resolve(entry);
        };
        reader.readAsText(entry.file);
      });
    }

    async function addFiles(fileList) {
      const newEntries = [];
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        newEntries.push({
          id: idCounter++,
          file: file,
          name: file.name,
          size: file.size,
          ext: getExtension(file.name),
          status: 'pending',
          originalContent: null,
          cleanedContent: null,
        });
      }
      files = files.concat(newEntries);
      render();

      for (const entry of newEntries) {
        await processFileEntry(entry);
        render();
      }
    }

    function removeFile(index) {
      if (index >= 0 && index < files.length) {
        files.splice(index, 1);
        render();
      }
    }

    function clearAll() {
      if (files.length === 0) return;
      if (!confirm('确定要清空所有文件吗？')) return;
      files = [];
      render();
    }

    // ============================================================
    // 6. 预览 & 下载
    // ============================================================
    function previewFile(index) {
      const f = files[index];
      if (!f || f.cleanedContent === undefined) {
        alert('该文件尚未处理，无法预览');
        return;
      }
      previewTitle.textContent = f.name;
      previewBody.innerHTML = `<code>${escapeHtml(f.cleanedContent)}</code>`;
      previewModal.classList.add('show');
    }

    function downloadSingle(index) {
      const f = files[index];
      if (!f || f.cleanedContent === undefined) return;
      const blob = new Blob([f.cleanedContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = getCleanedFilename(f.name);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function downloadAll() {
      const ready = files.filter(f => f.cleanedContent !== undefined);
      if (ready.length === 0) {
        alert('没有可下载的文件');
        return;
      }
      try {
        const zip = new JSZip();
        ready.forEach(f => {
          zip.file(getCleanedFilename(f.name), f.cleanedContent);
        });
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cleaned_files.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('打包失败: ' + err.message);
      }
    }

    // ============================================================
    // 7. 重新处理 (选项变更时)
    // ============================================================
    function reProcessAll() {
      if (files.length === 0) return;
      let pending = false;
      files.forEach(f => {
        if (f.originalContent !== undefined) {
          const options = {
            removeComments: optRemoveComments.checked,
            compressBlankLines: optCompressBlankLines.checked,
            stripTrailingSpaces: optStripTrailingSpaces.checked,
          };
          try {
            f.cleanedContent = cleanCode(f.originalContent, options);
            f.status = 'done';
          } catch (e) {
            f.status = 'error';
          }
          pending = true;
        }
      });
      if (pending) render();
    }

    // ============================================================
    // 8. 事件绑定
    // ============================================================
    fileInput.addEventListener('change', function(e) {
      if (this.files.length > 0) {
        addFiles(this.files);
      }
      this.value = '';
    });

    // 拖拽事件 (移动端不支持拖拽, 但桌面保留)
    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault();
      this.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', function(e) {
      e.preventDefault();
      this.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        addFiles(e.dataTransfer.files);
      }
    });

    // 选项变更
    optRemoveComments.addEventListener('change', reProcessAll);
    optCompressBlankLines.addEventListener('change', reProcessAll);
    optStripTrailingSpaces.addEventListener('change', reProcessAll);

    clearAllBtn.addEventListener('click', clearAll);
    downloadAllBtn.addEventListener('click', downloadAll);

    // 预览模态框关闭
    previewCloseBtn.addEventListener('click', () => previewModal.classList.remove('show'));
    previewModal.addEventListener('click', function(e) {
      if (e.target === this) previewModal.classList.remove('show');
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') previewModal.classList.remove('show');
    });

    // 初始渲染
    render();

  })();
</script>
</body>
</html>
